name: Deploy per SFTP

# Lädt den Stand des Branches auf den Webspace. Es wird gespiegelt: neue und
# geänderte Dateien werden hochgeladen, entfernte auf dem Server gelöscht.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, was hochgeladen und gelöscht würde"
        type: boolean
        default: false
      show_host_keys:
        description: "Nur die Hostschlüssel des Servers ausgeben (für SFTP_KNOWN_HOSTS)"
        type: boolean
        default: false

# Zwei gleichzeitige Deploys auf denselben Webspace wären ein Kuddelmuddel.
concurrency:
  group: sftp-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Hilfslauf: liest die Hostschlüssel des Servers aus und gibt sie im
  # Protokoll aus, damit sie in das Secret SFTP_KNOWN_HOSTS kopiert werden
  # können. Nützlich, weil ältere ssh-keyscan-Versionen (etwa das mit Windows
  # gelieferte) an neueren Key-Exchange-Verfahren scheitern und dann nur
  # Kommentarzeilen ausgeben. Hostschlüssel sind öffentlich – hier wird
  # nichts Vertrauliches protokolliert.
  hostkeys:
    if: ${{ inputs.show_host_keys }}
    runs-on: ubuntu-latest
    steps:
      - name: Hostschlüssel abfragen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
        run: |
          set -eu
          HOST=$(printf '%s' "${SFTP_HOST:-}" | tr -d '[:space:]')
          PORT=$(printf '%s' "${SFTP_PORT:-22}" | tr -d '[:space:]')
          if [ -z "$HOST" ]; then
            echo "::error::Das Secret SFTP_HOST fehlt."
            exit 1
          fi
          echo "Frage $HOST:$PORT ab …"
          ssh-keyscan -p "$PORT" "$HOST" > keys.txt 2> scan.log || true
          if ! grep -qv '^#' keys.txt || [ ! -s keys.txt ]; then
            echo "::error::Keine Hostschlüssel erhalten. Meldung des Scanners:"
            sed 's/^/  /' scan.log
            exit 1
          fi
          echo
          echo "Fingerabdrücke zum Abgleich mit den Angaben des Hosters:"
          ssh-keyscan -p "$PORT" "$HOST" 2>/dev/null | ssh-keygen -lf - | sed 's/^/  /'
          echo
          echo "--- Ab hier alles in das Secret SFTP_KNOWN_HOSTS kopieren ---"
          grep -v '^#' keys.txt
          echo "--- bis hier ---"

  deploy:
    if: ${{ !inputs.show_host_keys }}
    runs-on: ubuntu-latest
    steps:
      - name: Quellstand holen
        uses: actions/checkout@v5

      - name: Cache-Version in den Service Worker stempeln
        run: |
          set -eu
          sed -i "s/__BUILD__/${GITHUB_SHA:0:12}/" sw.js
          grep -n "const VERSION" sw.js

      - name: lftp installieren
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp sshpass

      - name: Zugangsdaten einrichten
        env:
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          if [ -z "${SFTP_KNOWN_HOSTS:-}" ]; then
            echo "::error::Das Secret SFTP_KNOWN_HOSTS fehlt. Diesen Workflow einmal"
            echo "::error::manuell mit der Option 'Nur die Hostschlüssel ausgeben' starten."
            exit 1
          fi
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # ssh-keyscan gibt Kommentarzeilen auch dann aus, wenn es gar keinen
          # Schlüssel bekommen hat. Wird so etwas eingefügt, scheiterte der Lauf
          # bisher erst später mit "Host key verification failed".
          if ! grep -qE '^[^#[:space:]]' ~/.ssh/known_hosts; then
            echo "::error::SFTP_KNOWN_HOSTS enthält keine Schlüsselzeile, nur Kommentare oder Leerzeilen."
            echo "::error::Diesen Workflow einmal manuell mit 'Nur die Hostschlüssel ausgeben' starten"
            echo "::error::und die dort protokollierten Zeilen vollständig in das Secret kopieren."
            exit 1
          fi
          echo "Hostschlüssel im Secret: $(grep -cE '^[^#[:space:]]' ~/.ssh/known_hosts)"
          if [ -n "${SFTP_KEY:-}" ]; then
            printf '%s\n' "$SFTP_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
          fi

      - name: Auf den Webspace spiegeln
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu

          # Beim Einfügen in die Secret-Maske rutschen leicht Leerzeichen oder
          # Zeilenumbrüche mit. Die machen sonst weiter unten das lftp-Skript
          # kaputt, statt eine verständliche Meldung zu erzeugen.
          SFTP_HOST=$(printf '%s' "${SFTP_HOST:-}" | tr -d '[:space:]')
          SFTP_USER=$(printf '%s' "${SFTP_USER:-}" | tr -d '[:space:]')
          SFTP_PORT=$(printf '%s' "${SFTP_PORT:-22}" | tr -d '[:space:]')
          REMOTE_DIR=$(printf '%s' "${REMOTE_DIR:-}" | tr -d '\r\n')

          for name in SFTP_HOST SFTP_USER REMOTE_DIR; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "::error::Das Secret $name fehlt."
              exit 1
            fi
          done

          # Der Benutzername landet unverändert in der ssh-Kommandozeile.
          case "$SFTP_USER" in
            *[!A-Za-z0-9._@-]*)
              echo "::error::SFTP_USER enthält unerwartete Zeichen. Erlaubt sind Buchstaben, Ziffern und . _ - @"
              exit 1 ;;
          esac
          case "$SFTP_HOST" in
            *[!A-Za-z0-9.-]*)
              echo "::error::SFTP_HOST enthält unerwartete Zeichen."
              exit 1 ;;
          esac
          case "$SFTP_PORT" in
            ''|*[!0-9]*) echo "::error::SFTP_PORT muss eine Zahl sein."; exit 1 ;;
          esac
          if [ -z "${SFTP_KEY:-}" ] && [ -z "${SFTP_PASSWORD:-}" ]; then
            echo "::error::Weder SFTP_KEY noch SFTP_PASSWORD gesetzt."
            exit 1
          fi

          # Notbremse: --delete auf dem Wurzelverzeichnis wäre verheerend.
          case "$REMOTE_DIR" in
            "/"|""|".") echo "::error::SFTP_REMOTE_DIR darf nicht das Wurzelverzeichnis sein."; exit 1 ;;
          esac

          # Der Benutzername gehört an ssh, nicht an lftp: bei "open -u user URL"
          # ohne Passwort verwirft lftp den Namen und meldet sich anonym an –
          # ssh verbindet dann als der Runner-Benutzer und scheitert.
          SSH_OPTS="-a -x -l $SFTP_USER -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          if [ -n "${SFTP_KEY:-}" ]; then
            CONNECT="ssh $SSH_OPTS -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o PreferredAuthentications=publickey"
          else
            export SSHPASS="$SFTP_PASSWORD"
            CONNECT="sshpass -e ssh $SSH_OPTS -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          fi

          DRY=""
          if [ "${DRY_RUN:-false}" = "true" ]; then
            DRY="--dry-run"
            echo "Trockenlauf – es wird nichts verändert."
          fi

          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 3;
            set net:timeout 20;
            set sftp:auto-confirm no;
            set sftp:connect-program \"$CONNECT\";
            open sftp://$SFTP_HOST:$SFTP_PORT;
            mirror --reverse --delete --verbose --no-perms $DRY \
                   --exclude '^\.git/' \
                   --exclude '^\.github/' \
                   --exclude '^\.gitignore$' \
                   ./ \"$REMOTE_DIR\";
          "

      - name: Ergebnis
        run: |
          echo "Ausgerollt: ${GITHUB_SHA:0:12}"
